<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity</title>
    <main-head></main-head>
    <script src="js/head.js"></script>
</head>

<body>
    <div class="app-container">
        <main-header></main-header>

        <main class="activities-page">
            <h1>Activity</h1>
            <form id="activity-form">
                <label for="activity-name">活動名</label>
                <input type="text" id="activity-name" name="name" maxlength="100" required>
                <label for="activity-time">タイム（秒）</label>
                <input type="number" id="activity-time" name="timeSeconds" min="0.01" max="999999.99" step="0.01" required>
                <button type="submit">活動を登録</button>
            </form>

            <p id="activity-status" role="status" aria-live="polite"></p>
            <ul id="activity-list" class="activity-list" aria-label="登録済みの活動"></ul>
        </main>

        <main-footer></main-footer>
    </div>

    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <script type="module" src="js/activities.js"></script>
</body>

</html>
