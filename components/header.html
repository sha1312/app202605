<header>
    <a href="index.html" class="card-link">
        <div class="logo-area">
            <span class="material-symbols-outlined">home_and_garden</span>
        </div>
    </a>
    <div class="header-actions">
        <button id="btn-settings" class="icon-btn" type="button" title="設定" aria-label="設定を開く">
            <span class="material-symbols-outlined">settings</span>
        </button>
        <button id="btn-profile" class="icon-btn" type="button" title="プロフィール">
            <span class="material-symbols-outlined">account_circle</span>
        </button>
    </div>
    <button id="panel-backdrop" class="panel-backdrop" type="button" aria-label="設定パネルを閉じる" tabindex="-1"></button>
    <aside id="side-panel" class="side-panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" aria-hidden="true" inert>
        <button id="btn-close" class="close-btn" type="button">✖ 閉じる</button>
        <div id="panel-content"><!-- ここにJSで中身を入れます --></div>
    </aside>
</header>
